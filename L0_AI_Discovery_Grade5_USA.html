<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Discovery · Level 0</title>
<style>:root{--bg:#F8FAFF;--acc:#1F4FA3;--accd:#163A78;--acc2:#E2553F;--soft:#EAF0FB}*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:21px;line-height:1.5;color:#1A2340;background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;background:#fff;border-bottom:3px solid var(--acc)}
header .brand{font-size:15px;font-weight:700;color:var(--acc)}header .lvl{font-size:15px;color:#56607a}
#app{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:56px;margin:10px 0;color:#1A2340}h2.h{font-size:34px;margin:8px 0 18px}h3{font-size:24px;margin:0 0 10px}
.big{font-size:30px;line-height:1.25}.lead{font-size:23px}.muted{color:#56607a;font-size:18px}.center{text-align:center}
.kicker{margin:0;color:var(--acc);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:18px}
.title,.topic{text-align:center;padding:40px 10px}.topic{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.topic h1{font-size:64px}.ticon{font-size:110px;line-height:1}
.nova{width:150px;flex:0 0 150px}.nova.big{width:210px;margin:0 auto}.nova svg{width:100%;height:auto}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 26px;cursor:pointer;min-height:52px}
.btn.main{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--accd)}.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible,.chip:focus-visible,.flip:focus-visible,.fc:focus-visible{outline:4px solid var(--acc2);outline-offset:2px}
.card{background:#fff;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 2px 0 #e2e6f0;border:2px solid #e8ebf3}
.learn{display:flex;gap:22px;align-items:flex-start}.learn .lt{flex:1}
.fact{background:var(--soft);border-radius:16px;padding:16px 20px;margin:16px 0;font-size:20px}
.de{display:flex;gap:14px;align-items:flex-start;background:#FFF8E1;border:2px dashed #E9B300;border-radius:16px;padding:14px 18px;margin:16px 0}
.de .flag{font-size:34px}.de p{margin:0;font-size:20px}
.key ul,.goals ul{margin:0;padding-left:26px}.key li,.goals li{margin:4px 0}
.goals{background:#fff;border-radius:22px;padding:18px 24px;border:2px solid var(--acc);margin-bottom:18px}
.think{border-color:var(--acc2)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}
.badge{background:var(--soft);color:#1A2340;border:2px solid var(--acc);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{font:inherit;position:relative;background:#fff;border:3px solid #e2e6f0;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:150px}
.tile:hover{border-color:var(--acc)}.tile.done{border-color:#22A06B;background:#F0FBF5}.ti{font-size:52px}.tn{font-weight:700;font-size:21px;text-align:center}
.tick{position:absolute;top:8px;right:12px;color:#22A06B;font-size:24px}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.chip{font:inherit;background:var(--soft);border:2px solid var(--acc);border-radius:14px;padding:12px 16px;cursor:pointer}
.ord li{background:#F0FBF5;border-radius:12px;padding:8px 12px;margin:6px 0}
.fb{min-height:30px;font-weight:700}.fb.ok{color:#137A4B}.fb.no{color:#A44A00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.flip,.fc{font:inherit;background:#fff;border:3px solid #e2e6f0;border-radius:20px;padding:18px;min-height:170px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.fi{font-size:48px}.fh{display:none;font-size:18px}.flip.open{border-color:var(--acc);background:var(--soft)}.flip.open .fh{display:block}
.bigidea{display:block;margin-top:6px;color:var(--acc);font-size:15px;font-style:normal;font-weight:700}
.fc .front{font-size:28px;font-weight:700}.fc .back{display:none;font-size:18px}.fc .back em{display:block;margin-top:8px;font-style:normal;font-weight:700;color:#8A5A00}
.fc.open{background:var(--soft);border-color:var(--acc)}.fc.open .front{display:none}.fc.open .back{display:block}
.sitem{font-size:30px;font-weight:700;text-align:center;background:var(--soft);border-radius:18px;padding:28px;margin:12px 0}
.bins{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}.theme{font-size:30px;font-weight:700;color:var(--acc);margin:0 0 10px}.bin{background:#fff;border:3px solid var(--acc);color:#1A2340;font-size:24px;min-width:200px}
.q{font-weight:700}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts.col{flex-direction:column}
.opt{font:inherit;text-align:left;background:#fff;border:2px solid #cfd5e4;border-radius:14px;padding:12px 16px;cursor:pointer}
.opt.right{background:#E3F7EC;border-color:#22A06B}.opt.wrong{background:#FDECE3;border-color:#D9733B}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}
.cert{text-align:center;border:4px solid var(--acc2)}.cert .nova{margin:0 auto;width:120px}.cert input{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #cfd5e4;width:min(420px,100%);margin:8px 0}
.certname{font-size:40px;font-weight:700;color:var(--acc);min-height:50px;margin:6px 0}
@media (max-width:640px){body{font-size:19px}h1{font-size:40px}.topic h1{font-size:44px}.learn{flex-direction:column-reverse;align-items:center}.bin{min-width:0;flex:1}}
@media print{header,.nav,#pr,.think,h2.h,.cert input,label{display:none!important}body{background:#fff}.cert{border:6px double var(--acc)}}

<script>const P={"loc":"US","cls":5,"title":"AI Discovery","subtitle":"AI in my city","goals":[{"t":"I can explain the difference between following rules and learning"},{"t":"I can use the words input, output and algorithm"},{"t":"I can find AI in my city"},{"t":"I can explain why people should check AI"}],"goalsTitle":"Learning Targets — I can…","thinkLabel":"Think · Pair · Share","keyLabel":"Big Ideas & Vocabulary","chapters":[{"id":"what","icon":"🤖","title":"What is AI?","type":"learn","head":"Rules or learning? Two ways computers work","paras":[{"t":"Some computers follow <b>rules</b> that people write: “IF the button is pressed THEN turn on the light.” That is a normal program."},{"t":"An <b>algorithm</b> is a list of steps, like a recipe."},{"t":"AI is different: it <b>learns</b> its rules from lots of <b>data</b> (examples)."},{"t":"In Chicago, a map app learns from millions of trips which roads are busy at 5 o’clock. Nobody wrote that rule — the AI learned it."},{"t":"Every computer has <b>input</b> (what goes in) and <b>output</b> (what comes out). For AI, the output is often a <b>prediction</b>."}],"fact":"Fact from the USA: In 2004 the <b>DARPA Grand Challenge</b> was the first big race for self-driving cars.","de":{"t":"Lena from Berlin says: In German cities, many buses show when they arrive. <b>Ankunft</b> = arrival, <b>Vorhersage</b> = prediction."},"key":[{"t":"Normal program = rules written by people"},{"t":"AI = learns rules from data"},{"t":"Input → AI → Output (prediction)"}],"think":"A traffic light changes every 60 seconds. Is it following rules or learning? How could it learn?","badges":["EU AI Act · AI Literacy","AI4K12 · Five Big Ideas"]},{"id":"how","icon":"🧠","title":"How does AI learn?","type":"steps","intro":"A smart traffic light wants to learn when the road is busy. Order the steps.","steps":[{"t":"📷 Cameras count cars every minute"},{"t":"📊 The counts are saved as data"},{"t":"🧠 AI finds busy times (pattern)"},{"t":"🚦 The light stays green longer at busy times"},{"t":"🙋 City workers check that it is safe"}],"after":"The light learned from data — that is AI. And people check it for safety!","de":{"t":"Lena from Berlin says: <b>Ampel</b> = traffic light. Germans love the little green <b>Ampelmännchen</b> in Berlin!"},"badges":["AI Literacy"]},{"id":"around","icon":"🌍","title":"AI around us","type":"cards","intro":"Tap each card to see AI in a city like Chicago.","cards":[{"i":"🗺️","n":"Map app","h":"It predicts traffic and finds the fastest way.","big":"Learning"},{"i":"🚌","n":"Bus arrival screens","h":"They predict when the next bus comes.","big":"Learning"},{"i":"🛒","n":"Shop recommendations","h":"Online shops suggest things you might like.","big":"Learning"},{"i":"🅿️","n":"Parking finder","h":"Cameras find free parking spaces.","big":"Perception"},{"i":"🌐","n":"Sign translator","h":"Point your phone at a sign — it translates it.","big":"Natural Interaction"},{"i":"🚦","n":"Smart traffic lights","h":"They learn busy times from car counts.","big":"Learning"},{"i":"🚲","n":"Bike-share app","h":"It predicts where bikes will be needed.","big":"Learning"}],"showBig":true,"badges":["AI4K12 · Five Big Ideas"]},{"id":"sort","icon":"🧺","title":"Sort it!","type":"sort","intro":"Does it follow fixed rules, or learn from data?","bins":["Learns from data 🧠","Follows fixed rules 📋"],"items":[{"n":"🗺️ Map that predicts traffic","v":0,"w":"It learned from many trips."},{"n":"🛗 Lift/elevator going to floor 3","v":1,"w":"Button → floor. A rule."},{"n":"🚌 Screen predicting bus arrival","v":0,"w":"It learns from bus data."},{"n":"🎫 Ticket machine","v":1,"w":"Pay → ticket. Fixed rule."},{"n":"🛒 Shop that suggests toys you might like","v":0,"w":"It learns your likes."},{"n":"🚪 Automatic door","v":1,"w":"Sensor → open. Simple rule."},{"n":"🌐 App that translates street signs","v":0,"w":"It learned languages."},{"n":"⏰ Clock tower","v":1,"w":"Just keeps time."}]},{"id":"words","icon":"🃏","title":"Magic AI words","type":"flash","intro":"Tap a card to flip it. The back also shows the German word, from our friend Lena!","cards":[{"w":"Rule","m":"An instruction like IF … THEN …","de":"Regel"},{"w":"Algorithm","m":"A list of steps, like a recipe.","de":"Algorithmus"},{"w":"Data","m":"Facts and examples a computer uses.","de":"Daten"},{"w":"Prediction","m":"A guess about what will happen.","de":"Vorhersage"},{"w":"Program","m":"Instructions a computer follows.","de":"Programm"},{"w":"Input","m":"What goes into a computer.","de":"Eingabe"},{"w":"Output","m":"What comes out of a computer.","de":"Ausgabe"}],"badges":["KMK · Digital Competences"]},{"id":"safe","icon":"🛡️","title":"Smart & safe with AI","type":"scen","intro":"Smart choices in the city.","scen":[{"q":"The map says to walk through a closed park at night.","o":["Follow it","Use your own sense and ask a grown-up"],"a":1,"w":"AI can be wrong. People decide."},{"q":"A shop app wants to know where you are all the time.","o":["Allow only when needed, with a grown-up","Allow always"],"a":0,"w":"Your location is personal data."},{"q":"A sign translator gives a funny wrong translation.","o":["Laugh and check another way","Believe it"],"a":0,"w":"Translations can be wrong."},{"q":"A city camera app shows people’s faces.","o":["Share the faces online","Respect privacy — don’t share"],"a":1,"w":"Faces are personal data (GDPR in the EU, USA COPPA)."}],"de":{"t":"Lena from Berlin says: In Germany, cameras in public places must follow strict privacy rules (DSGVO = GDPR)."},"badges":["GDPR · Data Protection","EU AI Act","USA COPPA","Human Oversight"]},{"id":"quiz","icon":"🎯","title":"What have you learned?","type":"quiz","qs":[{"q":"An algorithm is like a…","o":["recipe","pillow"],"a":0,"tf":0,"fill":0},{"q":"A normal program follows…","o":["rules written by people","its feelings"],"a":0,"tf":0,"fill":0},{"q":"AI learns its rules from…","o":["data","the moon"],"a":0,"tf":0,"fill":0},{"q":"What comes out of a computer?","o":["Output","Input"],"a":0,"tf":0,"fill":0},{"q":"True or false: A clock tower is AI.","o":["True","False"],"a":1,"tf":1,"fill":0},{"q":"AI often outputs a ___.","o":["prediction","pizza"],"a":0,"tf":0,"fill":1},{"q":"What does “Rule” mean?","o":["An instruction like IF … THEN …","Facts and examples a computer uses."],"a":0},{"q":"What does “Algorithm” mean?","o":["A list of steps, like a recipe.","What goes into a computer."],"a":0},{"q":"What does “Data” mean?","o":["Facts and examples a computer uses.","A list of steps, like a recipe."],"a":0}]},{"id":"cert","icon":"🏅","title":"Great job!","type":"cert","text":"You discovered how AI learns in the city — and how it differs from rules! Today’s theme: AI in my city.","reflect":"Exit ticket: Write one thing you learned about ai in my city, one question you still have, and one place you will spot AI this week.","badges":["EU AI Act · AI Literacy","GDPR · Data Protection","KMK · Digital Competences","AI4K12 · Five Big Ideas"]}],"badges":["EU AI Act · AI Literacy","AI4K12 · Five Big Ideas"]};
// Level 0 engine: menu (any order) → topic page → chapter content
const $=s=>document.querySelector(s);
const NOVA=`<svg viewBox="0 0 300 380" role="img" aria-label="Nova the robot"><line x1="150" y1="40" x2="150" y2="78" stroke="#1A2340" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="32" r="14" fill="var(--acc2)" stroke="#1A2340" stroke-width="4"/><rect x="44" y="124" width="20" height="48" rx="10" fill="#38BDF8" stroke="#1A2340" stroke-width="4"/><rect x="236" y="124" width="20" height="48" rx="10" fill="#38BDF8" stroke="#1A2340" stroke-width="4"/><rect x="60" y="76" width="180" height="140" rx="40" fill="#fff" stroke="#1A2340" stroke-width="5"/><rect x="82" y="98" width="136" height="96" rx="26" fill="#1E3A8A"/><ellipse cx="122" cy="134" rx="13" ry="16" fill="#7DD3FC"/><ellipse cx="178" cy="134" rx="13" ry="16" fill="#7DD3FC"/><path d="M120 162 Q150 190 180 162" stroke="#7DD3FC" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="136" y="214" width="28" height="18" fill="#fff" stroke="#1A2340" stroke-width="4"/><rect x="36" y="238" width="36" height="88" rx="18" fill="#fff" stroke="#1A2340" stroke-width="5"/><rect x="228" y="196" width="36" height="88" rx="18" fill="#fff" stroke="#1A2340" stroke-width="5" transform="rotate(32 246 240)"/><rect x="80" y="228" width="140" height="120" rx="36" fill="#fff" stroke="#1A2340" stroke-width="5"/><circle cx="150" cy="284" r="24" fill="#38BDF8" stroke="#1A2340" stroke-width="4"/><circle cx="150" cy="284" r="9" fill="#fff"/></svg>`;
const done=new Set();
const rot=(o,j)=>o.map((x,n)=>n).map((_,n,a)=>a[(n+j)%a.length]);
const badge=t=>`<span class="badge">🇪🇺 ${t}</span>`.replace('🇪🇺 NEP','🇮🇳 NEP').replace('🇪🇺 CBSE','🇮🇳 CBSE').replace('🇪🇺 India','🇮🇳 India').replace('🇪🇺 AI4K12','🇺🇸 AI4K12').replace('🇪🇺 CSTA','🇺🇸 CSTA').replace('🇪🇺 USA','🇺🇸 USA').replace('🇪🇺 KMK','🇩🇪 KMK');
const badges=a=>a&&a.length?`<div class="badges">${a.map(badge).join('')}</div>`:'';
function show(html){$('#app').innerHTML=html;window.scrollTo(0,0)}
function home(){
 show(`<section class="title"><div class="nova big">${NOVA}</div><p class="kicker">Level 0</p><h1>${P.title}</h1><p class="theme">${P.subtitle}</p>
 <p class="lead">Discover what Artificial Intelligence is, how it learns, where it is all around us — and how to use it safely.</p>
 ${badges(P.badges)}<button class="btn main" id="go">Start ✨</button></section>`);
 $('#go').onclick=menu}
function menu(){
 const ch=P.chapters.map((c,i)=>`<button class="tile ${done.has(c.id)?'done':''}" data-i="${i}"><span class="ti">${c.icon}</span><span class="tn">${i+1}. ${c.title}</span>${done.has(c.id)?'<span class="tick">✔</span>':''}</button>`).join('');
 show(`<h2 class="h">Choose any part — in any order</h2>
 <div class="goals"><h3>🎯 ${P.goalsTitle}</h3><ul>${P.goals.map(g=>`<li>${g.t}</li>`).join('')}</ul></div>
 <div class="tiles">${ch}</div><p class="muted center">${done.size} of ${P.chapters.length} parts explored</p>`);
 document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>topic(+t.dataset.i))}
function topic(i){const c=P.chapters[i];
 show(`<section class="topic"><div class="ticon">${c.icon}</div><h1>${c.title}</h1><button class="btn main" id="tgo">Let’s go →</button><button class="btn ghost" id="tback">← Menu</button></section>`);
 $('#tgo').onclick=()=>chapter(i);$('#tback').onclick=menu}
const nav=i=>`<div class="nav"><button class="btn ghost" onclick="menu()">← Menu</button>${i<P.chapters.length-1?`<button class="btn main" onclick="topic(${i+1})">Next: ${P.chapters[i+1].title} →</button>`:''}</div>`;
const de=d=>d?`<div class="de"><span class="flag">🇩🇪</span><p>${d.t}</p></div>`:'';
function finish(c){done.add(c.id)}
function chapter(i){const c=P.chapters[i];const R=R_[c.type];show(`<h2 class="h">${c.icon} ${c.title}</h2>`+R.html(c,i)+nav(i));R.init&&R.init(c,i)}
const R_={
 learn:{html:c=>`<div class="card learn"><div class="lt"><h3 class="big">${c.head}</h3>${c.paras.map(p=>`<p>${p.t}</p>`).join('')}</div><div class="nova">${NOVA}</div></div>
  <div class="fact">📌 ${c.fact}</div>${de(c.de)}
  <div class="card key"><h3>📝 ${P.keyLabel}</h3><ul>${c.key.map(k=>`<li>${k.t}</li>`).join('')}</ul></div>
  <div class="card think"><h3>💭 ${P.thinkLabel}</h3><p>${c.think}</p><button class="btn ghost" id="thk">I thought about it ✔</button></div>${badges(c.badges)}`,
  init:c=>{finish(c);$('#thk').onclick=e=>{e.target.textContent='Great thinking! 🌟';e.target.disabled=true}}},
 steps:{html:c=>`<div class="card"><p class="lead">${c.intro}</p><div id="pool" class="pool"></div><h3>Your order:</h3><ol id="ord" class="ord"></ol><p id="sfb" class="fb"></p><button class="btn ghost" id="srst">Start again ↺</button></div>${de(c.de)}${badges(c.badges)}`,
  init:c=>{let ord=[];const sh=c.steps.map((s,k)=>({...s,k})).sort((a,b)=>((a.k*7+3)%c.steps.length)-((b.k*7+3)%c.steps.length));
   const draw=()=>{$('#pool').innerHTML=sh.filter(s=>!ord.includes(s.k)).map(s=>`<button class="chip" data-k="${s.k}">${s.t}</button>`).join('');
    $('#ord').innerHTML=ord.map(k=>`<li>${c.steps[k].t}</li>`).join('');
    document.querySelectorAll('#pool .chip').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
     if(k===ord.length){ord.push(k);$('#sfb').textContent=ord.length===c.steps.length?'🎉 '+c.after:'✅ Yes! What comes next?';$('#sfb').className='fb ok';if(ord.length===c.steps.length)finish(c);draw()}
     else{$('#sfb').textContent='🤔 Not yet — think: what has to happen first?';$('#sfb').className='fb no'}})};
   draw();$('#srst').onclick=()=>{ord=[];$('#sfb').textContent='';draw()}}},
 cards:{html:c=>`<p class="lead">${c.intro}</p><div class="grid">${c.cards.map((k,j)=>`<button class="flip" data-j="${j}"><span class="fi">${k.i}</span><b>${k.n}</b><span class="fh">${k.h}${c.showBig?`<em class="bigidea">Big Idea: ${k.big}</em>`:''}</span></button>`).join('')}</div><p class="muted center" id="cnt"></p>${badges(c.badges)}`,
  init:c=>{const seen=new Set();const up=()=>{$('#cnt').textContent=`${seen.size} of ${c.cards.length} discovered`;if(seen.size===c.cards.length)finish(c)};up();
   document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{b.classList.add('open');seen.add(b.dataset.j);up()})}},
 sort:{html:c=>`<div class="card"><p class="lead">${c.intro}</p><div id="item" class="sitem"></div><div class="bins">${c.bins.map((b,n)=>`<button class="btn bin" data-v="${n}">${b}</button>`).join('')}</div><p id="sfb" class="fb"></p><p class="muted center" id="sc"></p></div>`,
  init:c=>{let k=0,ok=0;const draw=()=>{if(k>=c.items.length){$('#item').innerHTML=`🎉 All sorted! You got ${ok} of ${c.items.length} on the first try.`;document.querySelector('.bins').style.display='none';finish(c);return}
    $('#item').textContent=c.items[k].n;$('#sc').textContent=`${k+1} of ${c.items.length}`};let first=true;
   document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{const it=c.items[k];if(+b.dataset.v===it.v){if(first)ok++;$('#sfb').innerHTML='✅ '+it.w;$('#sfb').className='fb ok';k++;first=true;draw()}else{first=false;$('#sfb').innerHTML='🤔 Look again: '+it.w;$('#sfb').className='fb no'}});draw()}},
 flash:{html:c=>`<p class="lead">${c.intro}</p><div class="grid">${c.cards.map((k,j)=>`<button class="fc" data-j="${j}"><span class="front">${k.w}</span><span class="back">${k.m}<em>🇩🇪 ${k.de}</em></span></button>`).join('')}</div><p class="muted center" id="cnt"></p>${badges(c.badges)}`,
  init:c=>{const seen=new Set();const up=()=>{$('#cnt').textContent=`${seen.size} of ${c.cards.length} flipped`;if(seen.size===c.cards.length)finish(c)};up();
   document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{b.classList.toggle('open');seen.add(b.dataset.j);up()})}},
 scen:{html:c=>`<p class="lead">${c.intro}</p>${c.scen.map((s,j)=>`<div class="card sc" data-j="${j}"><p class="q">${j+1}. ${s.q}</p><div class="opts">${rot(s.o,j).map(n=>`<button class="opt" data-n="${n}">${s.o[n]}</button>`).join('')}</div><p class="fb"></p></div>`).join('')}${de(c.de)}${badges(c.badges)}`,
  init:c=>{const right=new Set();document.querySelectorAll('.sc').forEach(card=>{const s=c.scen[+card.dataset.j];card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const fb=card.querySelector('.fb');
   if(+b.dataset.n===s.a){b.classList.add('right');fb.innerHTML='✅ '+s.w;fb.className='fb ok';right.add(card.dataset.j);if(right.size===c.scen.length)finish(c)}else{b.classList.add('wrong');fb.innerHTML='🤔 Think again… '+s.w;fb.className='fb no'}})})}},
 quiz:{html:c=>`<div class="card"><p id="qn" class="muted"></p><p id="qq" class="q big"></p><div id="qo" class="opts col"></div><p id="qf" class="fb"></p><button class="btn main" id="qnext" style="display:none">Next →</button></div>`,
  init:c=>{let k=0,score=0,answered=false;const draw=()=>{if(k>=c.qs.length){finish(c);$('#qq').innerHTML=`🎉 You got <b>${score} of ${c.qs.length}</b>!`;$('#qo').innerHTML='';$('#qn').textContent='';$('#qf').textContent=score===c.qs.length?'Perfect score — amazing!':'Well done! You can try again any time.';$('#qf').className='fb ok';$('#qnext').style.display='inline-block';$('#qnext').textContent='Try again ↺';$('#qnext').onclick=()=>{k=0;score=0;$('#qnext').textContent='Next →';$('#qnext').onclick=nx;draw()};return}
    const q=c.qs[k];answered=false;$('#qn').textContent=`Question ${k+1} of ${c.qs.length}${q.tf?' · True or False':q.fill?' · Fill in the blank':''}`;$('#qq').textContent=q.q;$('#qf').textContent='';$('#qnext').style.display='none';
    $('#qo').innerHTML=(q.tf?q.o.map((_,n)=>n):rot(q.o,k)).map(n=>`<button class="opt" data-n="${n}">${q.o[n]}</button>`).join('');
    document.querySelectorAll('#qo .opt').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const r=+b.dataset.n===q.a;if(r)score++;b.classList.add(r?'right':'wrong');if(!r)document.querySelector(`#qo .opt[data-n="${q.a}"]`).classList.add('right');
     $('#qf').textContent=r?'✅ Correct!':'💡 The right answer is shown in green.';$('#qf').className='fb '+(r?'ok':'no');$('#qnext').style.display='inline-block'})};
   const nx=()=>{k++;draw()};$('#qnext').onclick=nx;draw()}},
 cert:{html:c=>`<div class="card cert" id="certCard"><div class="nova">${NOVA}</div><p class="kicker">Young IT Germany · Level 0</p><h3 class="big">🏅 AI Discoverer Certificate</h3>
